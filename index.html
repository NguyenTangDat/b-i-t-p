<form onsubmit="handleSubmit(event)">
    <input type="number" id="username" required>
    <button type="submit">Submit</button>
</form>

<script>
function handleSubmit(event) {
    event.preventDefault();

    // Lấy giá trị số nhập vào
    const endNum = parseInt(document.getElementById("username").value);

    let sum = 0;

    // Vòng lặp tính tổng các số chia hết cho 3 từ 1 đến N
    for (let i = 1; i <= endNum; i++) {
        if (i % 3 === 0) {
            sum += i;
        }
    }

    // In kết quả ra console
    console.log(sum);
}
</script>
